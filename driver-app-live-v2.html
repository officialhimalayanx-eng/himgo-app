<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HimGo — Driver</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #EFEFEF; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 12px; }
  .label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #6B6B6B; margin-bottom: 12px; }
  .phone-frame { width: 100%; max-width: 380px; background: #000; border-radius: 2.5rem; padding: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
  .screen { background: #101010; border-radius: 2rem; overflow: hidden; height: 720px; display: flex; flex-direction: column; position: relative; color: #F2F2F2; }
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 24px 20px 12px; flex-shrink: 0; }
  .topbar h1 { font-size: 17px; font-weight: 600; color: #F2F2F2; }
  .brand-strip { display: flex; align-items: center; gap: 6px; padding: 0 20px 4px; }
  .brand-dot { width: 9px; height: 9px; border-radius: 50%; background: #C6FF3D; }
  .brand-strip span { font-size: 12px; color: #7A7A7A; letter-spacing: 0.04em; }
  .toggle-wrap { display: flex; align-items: center; gap: 8px; }
  .toggle-label { font-size: 12px; color: #9A9A9A; }
  .toggle { width: 44px; height: 26px; border-radius: 20px; background: #2A2A2A; position: relative; cursor: pointer; border: none; }
  .toggle.on { background: #C6FF3D; }
  .toggle .knob { width: 20px; height: 20px; border-radius: 50%; background: #F2F2F2; position: absolute; top: 3px; left: 3px; transition: left 0.15s; }
  .toggle.on .knob { left: 21px; background: #0E1A00; }
  .map { position: relative; flex: 1; background: #181818; overflow: hidden; }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sheet { background: #1B1B1B; padding: 18px 20px 26px; border-radius: 24px 24px 0 0; margin-top: -24px; position: relative; z-index: 2; }
  .status-msg { text-align: center; padding: 40px 24px; }
  .status-msg .icon { font-size: 34px; margin-bottom: 12px; }
  .status-msg p { font-size: 14px; color: #B0B0B0; line-height: 1.5; }
  .status-msg .big { font-size: 16px; font-weight: 600; color: #F2F2F2; margin-bottom: 6px; }
  .request-card { padding: 4px 0; }
  .req-route { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .req-point { display: flex; align-items: center; gap: 10px; }
  .req-point .dot { width: 8px; height: 8px; border-radius: 50%; background: #C6FF3D; flex-shrink: 0; }
  .req-point .dot.pin { background: #FF5C5C; border-radius: 3px; }
  .req-point span { font-size: 13px; color: #E6E6E6; }
  .req-fare-row { display: flex; align-items: center; justify-content: space-between; background: #262626; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .req-fare-row .lbl { font-size: 11px; color: #9A9A9A; }
  .req-fare-row .amt { font-size: 22px; font-weight: 700; color: #C6FF3D; }
  .req-meta { font-size: 12px; color: #9A9A9A; margin-bottom: 16px; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn-reject { background: #262626; color: #E6E6E6; }
  .btn-accept { background: #C6FF3D; color: #0E1A00; }
  .counter-row { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .step-btn { width: 38px; height: 38px; border-radius: 50%; background: #262626; border: none; color: #C6FF3D; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .counter-amt { font-size: 24px; font-weight: 700; color: #F2F2F2; min-width: 90px; text-align: center; }
  .link-btn { background: none; border: none; color: #9A9A9A; font-size: 12px; text-decoration: underline; cursor: pointer; width: 100%; text-align: center; margin-top: 4px; }
  .driver-row { display: flex; align-items: center; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #262626; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #262626; color: #C6FF3D; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0; }
  .rider-info { flex: 1; }
  .rider-info .name { font-size: 14px; font-weight: 500; color: #F2F2F2; }
  .rider-info .sub { font-size: 12px; color: #9A9A9A; }
  .trip-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; }
  .trip-footer .status { font-size: 12px; color: #9A9A9A; }
  .trip-footer .ride-fare { font-size: 14px; font-weight: 600; color: #C6FF3D; margin-top: 2px; }
  .complete-btn { background: #C6FF3D; color: #0E1A00; font-size: 12px; font-weight: 600; padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; }
  .complete-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .check-circle { width: 64px; height: 64px; border-radius: 50%; background: #1E2411; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px; }
  .fare-label { font-size: 13px; color: #9A9A9A; margin-bottom: 4px; }
  .fare-total { font-size: 32px; font-weight: 700; color: #C6FF3D; margin-bottom: 24px; }
  .primary-btn { width: 100%; background: #C6FF3D; color: #0E1A00; font-weight: 600; font-size: 14px; padding: 15px; border-radius: 12px; border: none; margin-top: 14px; cursor: pointer; }
  .auth-tabs { display: flex; gap: 8px; padding: 0 20px 10px; }
  .auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; color: #9A9A9A; background: #1B1B1B; }
  .auth-tab.active { background: #C6FF3D; color: #0E1A00; }
  .field { display: flex; align-items: center; gap: 12px; background: #262626; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
  .field input, .field select { border: none; background: transparent; outline: none; font-size: 14px; color: #F2F2F2; flex: 1; font-family: inherit; }
  .error-msg { color: #FF6B6B; font-size: 12px; padding: 0 20px 8px; min-height: 14px; }
  .center-loading { flex: 1; display: flex; align-items: center; justify-content: center; color: #9A9A9A; font-size: 13px; }
  .stars { display: flex; gap: 4px; justify-content: center; margin: 10px 0 24px; }
  .star-btn { background: none; border: none; cursor: pointer; font-size: 26px; color: #3A3A3A; padding: 0; }
  .star-btn.filled { color: #C6FF3D; }
</style>
</head>
<body>

<p class="label">HimGo Driver &middot; live</p>
<div class="phone-frame">
  <div class="screen" id="screen"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyBvfAhIrX5gXvcZChz9HD238UftrjzkY_M",
  authDomain: "himgo-758d2.firebaseapp.com",
  projectId: "himgo-758d2",
  storageBucket: "himgo-758d2.firebasestorage.app",
  messagingSenderId: "962613964904",
  appId: "1:962613964904:web:b527c75e385a833a740bdd",
  measurementId: "G-G7LMF1KLB9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const VEHICLE_NAMES = { bike: "Bike", car: "Car" };

function mapSvg(animate) {
  return `<svg viewBox="0 0 400 400">
    <path d="M0,80 H400" stroke="#242424" stroke-width="6"/>
    <path d="M0,220 H400" stroke="#242424" stroke-width="10"/>
    <path d="M60,0 V400" stroke="#242424" stroke-width="6"/>
    <path d="M280,0 V400" stroke="#242424" stroke-width="8"/>
    <path d="M0,340 H400" stroke="#242424" stroke-width="5"/>
    <path d="M90,300 C150,260 180,180 260,110" stroke="#C6FF3D" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round" fill="none"/>
    <circle cx="90" cy="300" r="7" fill="#C6FF3D"/>
    <circle cx="260" cy="110" r="7" fill="#FF5C5C"/>
    ${animate ? `<circle r="6" fill="#C6FF3D"><animateMotion dur="2.5s" repeatCount="indefinite" path="M90,300 C150,260 180,180 260,110"/></circle>` : ""}
  </svg>`;
}
function brandStrip() { return `<div class="brand-strip"><div class="brand-dot"></div><span>HimGo Driver</span></div>`; }
function initials(name) { return (name||"?").split(" ").map(n => n[0]).join("").toUpperCase(); }

let state = {
  step: "loading", // loading, login, signup, offline, waiting, request, counter, trip, complete
  user: null, userName: "", userVehicle: "bike",
  authError: "",
  online: false,
  openRides: [],
  currentRide: null,
  counterFare: 0,
  myRideUnsub: null,
  openRidesUnsub: null,
  myRating: 0,
  ratingSubmitted: false,
};

function render() {
  const el = document.getElementById("screen");
  el.innerHTML = renderers[state.step]();
  attach[state.step] && attach[state.step]();
}

const renderers = {
  loading: () => `<div class="center-loading">Loading...</div>`,
  login: () => `
    ${brandStrip()}
    <div class="topbar"><h1>Log In</h1></div>
    <div class="auth-tabs"><div class="auth-tab active">Log In</div><div class="auth-tab" id="toSignup">Sign Up</div></div>
    <div class="error-msg">${state.authError}</div>
    <div class="sheet" style="margin-top:0;border-radius:0;">
      <div class="field"><input id="email" type="email" placeholder="Email"/></div>
      <div class="field"><input id="password" type="password" placeholder="Password"/></div>
      <button class="primary-btn" id="loginBtn">Log In</button>
    </div>`,
  signup: () => `
    ${brandStrip()}
    <div class="topbar"><h1>Sign Up (Driver)</h1></div>
    <div class="auth-tabs"><div class="auth-tab" id="toLogin">Log In</div><div class="auth-tab active">Sign Up</div></div>
    <div class="error-msg">${state.authError}</div>
    <div class="sheet" style="margin-top:0;border-radius:0;">
      <div class="field"><input id="name" type="text" placeholder="Full name"/></div>
      <div class="field">
        <select id="vehicleType" style="width:100%;">
          <option value="bike">Bike</option>
          <option value="car">Car</option>
        </select>
      </div>
      <div class="field"><input id="plate" type="text" placeholder="Vehicle plate number"/></div>
      <div class="field"><input id="email" type="email" placeholder="Email"/></div>
      <div class="field"><input id="password" type="password" placeholder="Password (6+ characters)"/></div>
      <button class="primary-btn" id="signupBtn">Create Account</button>
    </div>`,
  offline: () => `
    ${brandStrip()}
    <div class="topbar"><h1>Offline</h1><div class="toggle-wrap"><span class="toggle-label">Go online</span><button class="toggle" id="onlineToggle"><div class="knob"></div></button></div></div>
    <div class="map">${mapSvg(false)}</div>
    <div class="status-msg"><div class="icon">😴</div><p class="big">You are offline</p><p>Turn on the toggle to go online</p></div>`,
  waiting: () => {
    const has = state.openRides.length > 0;
    return `
    ${brandStrip()}
    <div class="topbar"><h1>Online</h1><div class="toggle-wrap"><span class="toggle-label">Go online</span><button class="toggle on" id="onlineToggle"><div class="knob"></div></button></div></div>
    <div class="map">${mapSvg(false)}</div>
    <div class="status-msg">
      <div class="icon">${has ? "📥" : "📡"}</div>
      <p class="big">${has ? "New request available!" : "Waiting for ride requests..."}</p>
      <p>${has ? "Tap below to view" : "Nearby requests will appear here"}</p>
      ${has ? `<button class="primary-btn" id="viewReqBtn">View Request</button>` : ""}
    </div>`;
  },
  request: () => {
    const r = state.currentRide;
    return `
      ${brandStrip()}
      <div class="topbar"><h1>New Ride Request</h1></div>
      <div class="map">${mapSvg(false)}</div>
      <div class="sheet request-card">
        <div class="req-route">
          <div class="req-point"><div class="dot"></div><span>${r.pickup}</span></div>
          <div class="req-point"><div class="dot pin"></div><span>${r.drop}</span></div>
        </div>
        <p class="req-meta">${r.distanceKm} km &middot; ${VEHICLE_NAMES[r.vehicleType] || "Bike"} &middot; rider: ${r.riderName}</p>
        <div class="req-fare-row"><span class="lbl">Rider's offer</span><span class="amt">Rs ${r.riderOfferFare}</span></div>
        <div class="btn-row">
          <button class="btn-reject" id="rejectBtn">Skip</button>
          <button class="btn-accept" id="acceptBtn">Accept this price</button>
        </div>
        <button class="link-btn" id="counterLink">Send a counter offer</button>
      </div>`;
  },
  counter: () => {
    const r = state.currentRide;
    if (!state.counterFare) state.counterFare = r.riderOfferFare + 10;
    return `
      ${brandStrip()}
      <div class="topbar"><h1>Counter Offer</h1></div>
      <div class="map">${mapSvg(false)}</div>
      <div class="sheet">
        <p class="req-meta">${r.distanceKm} km &middot; rider offer Rs ${r.riderOfferFare}</p>
        <div class="counter-row">
          <button class="step-btn" id="cMinus">&minus;</button>
          <div class="counter-amt">Rs ${state.counterFare}</div>
          <button class="step-btn" id="cPlus">&plus;</button>
        </div>
        <button class="primary-btn" id="sendCounterBtn">Send Offer</button>
        <button class="link-btn" id="backToReq">Back</button>
      </div>`;
  },
  trip: () => {
    const r = state.currentRide;
    const arriving = r.status === "arriving";
    return `
      ${brandStrip()}
      <div class="topbar"><h1>${arriving ? "Head to pickup" : "Trip in progress"}</h1></div>
      <div class="map">${mapSvg(!arriving)}</div>
      <div class="sheet">
        <div class="driver-row">
          <div class="avatar">${initials(r.riderName)}</div>
          <div class="rider-info"><div class="name">${r.riderName}</div><div class="sub">${r.pickup.split(",")[0]} &rarr; ${r.drop.split(",")[0]}</div></div>
        </div>
        <div class="trip-footer">
          <div><div class="status">${arriving ? "Go to pickup" : "Heading to destination"}</div><div class="ride-fare">Rs ${r.agreedFare}</div></div>
          <button class="complete-btn" id="nextBtn">${arriving ? "Rider picked up" : "Complete Trip"}</button>
        </div>
      </div>`;
  },
  complete: () => `
    ${brandStrip()}
    <div class="topbar"><h1>Trip Complete</h1></div>
    <div class="complete-body">
      <div class="check-circle">✅</div>
      <p class="fare-label">You earned</p>
      <p class="fare-total">Rs ${state.currentRide && state.currentRide.agreedFare}</p>
      ${state.ratingSubmitted ? `
        <p class="fare-label" style="margin-bottom:20px;">Thanks for rating your rider!</p>
      ` : `
        <p class="fare-label">Rate your rider</p>
        <div class="stars">${[1,2,3,4,5].map(n => `<button class="star-btn ${n <= state.myRating ? "filled" : ""}" data-n="${n}">&#9733;</button>`).join("")}</div>
      `}
      <button class="primary-btn" id="againBtn" style="margin-top:0">${state.ratingSubmitted ? "Wait for Next Request" : "Skip and wait for next"}</button>
    </div>`
};

const attach = {
  login: () => {
    document.getElementById("toSignup").onclick = () => { state.authError=""; state.step="signup"; render(); };
    document.getElementById("loginBtn").onclick = async () => {
      try { await auth.signInWithEmailAndPassword(document.getElementById("email").value.trim(), document.getElementById("password").value); }
      catch (e) { state.authError = e.message.replace("Firebase: ", ""); render(); }
    };
  },
  signup: () => {
    document.getElementById("toLogin").onclick = () => { state.authError=""; state.step="login"; render(); };
    document.getElementById("signupBtn").onclick = async () => {
      const name = document.getElementById("name").value.trim();
      const vehicleType = document.getElementById("vehicleType").value;
      const plate = document.getElementById("plate").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!name) { state.authError = "Please enter your name"; render(); return; }
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection("users").doc(cred.user.uid).set({ name, vehicleType, plate, email, role: "driver", ratingSum: 0, ratingCount: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      } catch (e) { state.authError = e.message.replace("Firebase: ", ""); render(); }
    };
  },
  offline: () => {
    document.getElementById("onlineToggle").onclick = () => { state.online = true; state.step = "waiting"; render(); listenOpenRides(); };
  },
  waiting: () => {
    document.getElementById("onlineToggle").onclick = () => { state.online = false; state.step = "offline"; if (state.openRidesUnsub) state.openRidesUnsub(); render(); };
    const btn = document.getElementById("viewReqBtn");
    if (btn) btn.onclick = () => { state.currentRide = state.openRides[0]; state.step = "request"; render(); };
  },
  request: () => {
    document.getElementById("rejectBtn").onclick = () => { state.step = "waiting"; render(); };
    document.getElementById("acceptBtn").onclick = async () => { await submitOffer(state.currentRide.riderOfferFare); };
    document.getElementById("counterLink").onclick = () => { state.step = "counter"; render(); };
  },
  counter: () => {
    document.getElementById("cMinus").onclick = () => { state.counterFare = Math.max(state.currentRide.riderOfferFare, state.counterFare - 5); render(); };
    document.getElementById("cPlus").onclick = () => { state.counterFare += 5; render(); };
    document.getElementById("backToReq").onclick = () => { state.step = "request"; render(); };
    document.getElementById("sendCounterBtn").onclick = async () => { await submitOffer(state.counterFare); };
  },
  trip: () => {
    document.getElementById("nextBtn").onclick = async () => {
      const r = state.currentRide;
      const newStatus = r.status === "arriving" ? "ongoing" : "completed";
      await db.collection("rides").doc(r.id).update({ status: newStatus });
    };
  },
  complete: () => {
    document.querySelectorAll(".star-btn").forEach(b => {
      b.onclick = async () => {
        state.myRating = parseInt(b.dataset.n, 10);
        render();
        const riderId = state.currentRide.riderId;
        await db.collection("rides").doc(state.currentRide.id).update({ driverRatingGiven: state.myRating });
        await db.collection("users").doc(riderId).update({
          ratingSum: firebase.firestore.FieldValue.increment(state.myRating),
          ratingCount: firebase.firestore.FieldValue.increment(1),
        });
        state.ratingSubmitted = true;
        render();
      };
    });
    document.getElementById("againBtn").onclick = () => {
      if (state.myRideUnsub) state.myRideUnsub();
      state.currentRide = null;
      state.myRating = 0;
      state.ratingSubmitted = false;
      state.step = "waiting";
      render();
      listenOpenRides();
    };
  }
};

async function submitOffer(fare) {
  const r = state.currentRide;
  const myInfo = await getUserInfo(state.user.uid);
  const myRating = myInfo && myInfo.ratingCount > 0 ? myInfo.ratingSum / myInfo.ratingCount : 5;
  await db.collection("rides").doc(r.id).update({
    offers: firebase.firestore.FieldValue.arrayUnion({ driverId: state.user.uid, driverName: state.userName, offerFare: fare, driverRating: myRating })
  });
  if (state.myRideUnsub) state.myRideUnsub();
  state.myRideUnsub = db.collection("rides").doc(r.id).onSnapshot((snap) => {
    if (!snap.exists) return;
    const data = snap.data();
    if (data.acceptedDriverId === state.user.uid) {
      state.currentRide = { id: r.id, ...data };
      if (data.status === "arriving" || data.status === "ongoing") state.step = "trip";
      else if (data.status === "completed") state.step = "complete";
      render();
    }
  });
  state.step = "waiting";
  state.currentRide = null;
  render();
}

function listenOpenRides() {
  if (state.openRidesUnsub) state.openRidesUnsub();
  let q = db.collection("rides").where("status", "==", "searching");
  if (state.userVehicle) q = q.where("vehicleType", "==", state.userVehicle);
  state.openRidesUnsub = q.onSnapshot((snap) => {
    state.openRides = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    if (state.step === "waiting" || state.step === "request") render();
  }, () => {
    // fallback without vehicle filter if index missing
    state.openRidesUnsub = db.collection("rides").where("status", "==", "searching").onSnapshot((snap) => {
      state.openRides = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      if (state.step === "waiting" || state.step === "request") render();
    });
  });
}

auth.onAuthStateChanged(async (user) => {
  state.user = user;
  if (user) {
    const info = await getUserInfo(user.uid);
    state.userName = (info && info.name) || user.displayName || "Driver";
    state.userVehicle = (info && info.vehicleType) || "bike";
    state.step = "offline";
    render();
  } else {
    state.step = "login"; render();
  }
});

async function getUserInfo(uid) {
  try { const snap = await db.collection("users").doc(uid).get(); return snap.exists ? snap.data() : null; }
  catch { return null; }
}

render();
</script>
</body>
</html>
