<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HimGo — Nepal's Ride Platform</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  background: #101010;
  color: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
}

.logo {
  width: 78px;
  height: 78px;
  margin: 0 auto 20px;
  border-radius: 22px;
  background: #c6ff3d;
  color: #0e1a00;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 34px;
  font-weight: 800;
  box-shadow: 0 12px 35px rgba(198,255,61,.15);
}

h1 {
  font-size: 36px;
  margin-bottom: 8px;
}

.tagline {
  color: #9a9a9a;
  font-size: 15px;
  margin-bottom: 38px;
}

.card {
  background: #1b1b1b;
  border: 1px solid #2a2a2a;
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 14px;
  text-align: left;
}

.card h2 {
  font-size: 18px;
  margin-bottom: 7px;
}

.card p {
  color: #9a9a9a;
  font-size: 13px;
  margin-bottom: 17px;
}

.btn {
  display: block;
  width: 100%;
  text-decoration: none;
  text-align: center;
  padding: 15px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
}

.rider {
  background: #c6ff3d;
  color: #0e1a00;
}

.driver {
  background: #262626;
  color: #f5f5f5;
  border: 1px solid #3a3a3a;
}

.footer {
  margin-top: 28px;
  color: #666;
  font-size: 11px;
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">HG</div>

  <h1>HimGo</h1>
  <p class="tagline">Simple. Fast. Local rides across Nepal.</p>

  <div class="card">
    <h2>🚕 Ride with HimGo</h2>
    <p>Book a ride and connect with nearby drivers.</p>
    <a class="btn rider" href="rider-app-live-v2.html">
      Open Rider App
    </a>
  </div>

  <div class="card">
    <h2>🚗 Drive with HimGo</h2>
    <p>Accept ride requests and earn with HimGo.</p>
    <a class="btn driver" href="driver-app-live-v2.html">
      Open Driver App
    </a>
  </div>

  <div class="footer">
    © 2026 HimGo. Built for Nepal.
  </div>

</div>

</body>
</html>
